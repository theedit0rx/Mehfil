name: Build Mehfil Auto Android APK
on:
  push:
    branches: [mehfil-auto]
    paths:
      - 'mehfil-auto/**'
      - '.github/workflows/build-mehfil-auto.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: mehfil-auto/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp mehfil-auto/android/app/build/outputs/apk/debug/app-debug.apk Mehfil-Auto.apk
      - name: Attach build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mehfil-Auto-APK
          path: Mehfil-Auto.apk
          retention-days: 90
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mehfil-auto-v1 >/dev/null 2>&1; then
            gh release upload mehfil-auto-v1 Mehfil-Auto.apk --clobber
          else
            gh release create mehfil-auto-v1 Mehfil-Auto.apk --title 'Mehfil Auto Android v1' --notes 'Local-first offline music organizer. Grant Music & audio access to scan local songs. This is a debug-signed development APK.'
          fi
